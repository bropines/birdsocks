name: CI

# Every push to main and every pull request: the daemon's Go tests and gofmt,
# then a debug APK with the NewApi lint. Releases are release.yml's, on a tag.
#
# Not here: the Compose preview screenshot tests. Their reference images are
# not committed (app/src/screenshotTestDebug/ is ignored), so there is nothing
# to validate against; render them locally (docs/BUILDING.md).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/FUNDING.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/FUNDING.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  go:
    name: Go tests and gofmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: ./.github/actions/go-env
        with:
          cache-name: test

      - name: gofmt (appctr, birdsocksd)
        run: |
          unformatted=$(gofmt -l appctr/*.go appctr/birdsocksd)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on these files:"
            echo "$unformatted"
            exit 1
          fi

      # The pinned NetBird release, checked against NETBIRD_SHA256, with the
      # patches applied and birdsocksd copied in: what the APK is built from.
      - name: Prepare the patched NetBird tree
        run: bash appctr/build.sh --prepare

      # -checklinkname=0: the vendored anet (patch 03) links into net.zoneCache.
      # The packages our patches add to or change and that test quickly:
      # the SOCKS5/DNS proxies (netstack), the control proxy (client/net),
      # inbound forwarding, anet, the DNS race of birdsocksd, Signal's redial.
      - name: Test the daemon's packages
        working-directory: appctr/netbird_src
        run: |
          go test -ldflags=-checklinkname=0 -count=1 -timeout 10m \
            ./client/iface/netstack/... \
            ./client/net/ \
            ./client/firewall/uspfilter/forwarder/ \
            ./client/internal/anet/ \
            ./client/birdsocksd/ \
            ./shared/signal/client/ \
            ./shared/relay/client/dialer/ws/ \
            ./client/grpc/ \
            ./client/system/ \
            ./client/internal/stdnet/

      # The rest of the patched packages only compile with their tests: the
      # engine's and the server's suites are long, uspfilter's takes minutes,
      # and NetBird's dns suite is timing-sensitive on shared runners.
      - name: Compile the other patched packages' tests
        working-directory: appctr/netbird_src
        run: |
          go test -ldflags=-checklinkname=0 -count=1 -run '^$' \
            ./client/internal/ \
            ./client/internal/dns/ \
            ./client/server/ \
            ./client/firewall/uspfilter/ \
            ./client/iface/device/

      # The bridge (appctr): vet, and its tests (the live daemon test skips
      # without BIRDSOCKS_LIVE_LIB).
      - name: Vet and test the bridge
        working-directory: appctr
        run: |
          go vet .
          go test -count=1 .

      - name: Save the Go cache
        if: github.event_name == 'push' && steps.go.outputs.go-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go.outputs.go-cache-key }}

      - name: Save the NetBird archive
        if: github.event_name == 'push' && steps.go.outputs.dist-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/netbird-dist
          key: ${{ steps.go.outputs.dist-cache-key }}

  android:
    name: Debug APK and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive # hev-socks5-tunnel and its lwIP, hev-task-system

      - id: go
        uses: ./.github/actions/go-env
        with:
          cache-name: core

      - uses: ./.github/actions/ndk

      # One ABI is enough to prove the core builds and the app compiles
      # against the bridge; the release builds all four.
      - name: Build the native core (arm64-v8a)
        env:
          TS_ABIS: arm64-v8a
        run: |
          # gomobile and gobind at the x/mobile version appctr/go.mod requires.
          MOBILE_VER=$(awk '$1 == "golang.org/x/mobile" { print $2 }' appctr/go.mod)
          go install "golang.org/x/mobile/cmd/gomobile@$MOBILE_VER" "golang.org/x/mobile/cmd/gobind@$MOBILE_VER"
          bash appctr/build.sh

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # basic: the open-source cache provider. The default ("enhanced") is a
      # proprietary service, free only as a preview for private repositories.
      # Writes from main only (the action's default), reads everywhere.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # -PlintNewApiOnly fails on nothing but a call above minSdk
      # (app/build.gradle.kts); the full lint is not a gate.
      - name: Assemble debug and lint (NewApi)
        run: ./gradlew assembleDebug lintDebug -PlintNewApiOnly -PtargetAbi=arm64-v8a --stacktrace

      - name: Name the debug APK
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' version.properties)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
            "out/BirdSocks-v${version}-arm64-v8a-$(git rev-parse --short=7 HEAD)-dev.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: birdsocks-debug-arm64-v8a
          path: out/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload the lint report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

      - name: Save the Go cache
        if: github.event_name == 'push' && steps.go.outputs.go-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go.outputs.go-cache-key }}
