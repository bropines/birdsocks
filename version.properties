# The version of the next release, the single place it is written.
#
# Bump both lines in the release commit and tag it v<VERSION_NAME>
# (docs/RELEASING.md). The release workflow refuses a tag that disagrees.
# F-Droid reads the two lines from the tagged commit to find updates.
#
# VERSION_CODE is major*1000000 + minor*10000 + patch*100. The last two digits
# stay free for per-ABI APKs (app/build.gradle.kts adds 1 to 4).
VERSION_NAME=0.2.0
VERSION_CODE=20000
